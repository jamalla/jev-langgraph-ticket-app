# Render Blueprint: one Docker web service. https://render.com/docs/blueprint-spec
# Render asks for the sync:false values once, when the Blueprint is created.
# All are optional: empty keys run that model in mock mode, empty models use the defaults.
services:
  - type: web
    name: jev-langgraph-ticket-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TYPESAFE_API_KEY
        sync: false
      - key: TYPESAFE_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JEV_MODEL
        sync: false
      - key: LLM_MODEL
        sync: false
